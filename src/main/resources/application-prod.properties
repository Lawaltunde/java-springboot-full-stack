spring.application.name=jfs
# Required: set these on the host. No defaults, so a missing value stops startup.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always

cors.allowed.origins=*
cors.allowed.methods=*

server.max-http-request-header-size=65KB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# AWS S3 Configuration
aws.region=eu-west-1
aws.s3.bucket=amigoscode-product-images-prod
aws.s3.endpoint-override=
aws.s3.path-style-enabled=false
# Credentials are not set here. AwsS3Config falls back to the AWS SDK default
# chain: the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY env vars, or the EC2 IAM role.
